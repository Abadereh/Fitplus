name: Cleanup Mozarebe v1.0.15 transfer
on:
  push:
    paths:
      - '.github/workflows/cleanup-mozarebe-v115-transfer.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Delete temporary public release and transfer workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release delete "mozarebe-v1.0.15-chat-transfer" --yes --cleanup-tag || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/publish-mozarebe-v115-transfer.yml .github/workflows/cleanup-mozarebe-v115-transfer.yml
          git commit -m "Clean temporary Mozarebe transfer release workflow"
          git push
