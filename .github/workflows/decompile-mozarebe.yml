name: Decompile Mozarebe v1.0.14
on:
  push:
    paths:
      - '.github/workflows/decompile-mozarebe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  decompile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download JADX
        run: |
          set -e
          curl -L --fail --retry 3 -o jadx.zip https://github.com/skylot/jadx/releases/download/v1.5.3/jadx-1.5.3.zip
          unzip -q jadx.zip -d jadx
          chmod +x jadx/bin/jadx
      - name: Decompile APK
        run: |
          set -e
          rm -rf jadx_out
          jadx/bin/jadx -d jadx_out Mozarebe-v1.0.14-fixedkey.apk
          grep -R "پروفایل" -n jadx_out/sources | head -50 || true
          grep -R "چاپ نوفر" -n jadx_out/sources | head -50 || true
      - name: Pack decompiled source
        run: |
          zip -qr Mozarebe-v1.0.14-jadx.zip jadx_out
      - uses: actions/upload-artifact@v4
        with:
          name: Mozarebe-v1.0.14-jadx
          path: Mozarebe-v1.0.14-jadx.zip
          retention-days: 1
