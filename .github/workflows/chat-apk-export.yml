name: Chat APK Export
on:
  push:
    paths:
      - '.github/workflows/chat-apk-export.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mozarebe-v1.0.14-fixedkey
          path: Mozarebe-v1.0.14-fixedkey.apk
          compression-level: 0
          retention-days: 1
