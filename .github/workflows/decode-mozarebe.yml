name: Decode Mozarebe APK for Quick View Patch
on:
  push:
    paths:
      - '.github/workflows/decode-mozarebe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download apktool
        run: |
          curl -L --fail --retry 3 -o apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v2.11.1/apktool_2.11.1.jar
      - name: Decode
        run: |
          java -jar apktool.jar d -f Mozarebe-v1.0.14-fixedkey.apk -o decoded
          FILE=$(find decoded -name 'MainActivity.smali' | head -1)
          echo "MAIN=$FILE"
          awk '/\.method private showProfileDetail\(J\)V/{flag=1} flag{print} flag&&/\.end method/{exit}' "$FILE" > showProfileDetail.smali.txt
          awk '/\.method private checkRow\(JLcom\/aoto\/mozarebe\/Models\$ChecklistItem;Lcom\/aoto\/mozarebe\/MainActivity\$ProfileRowView;\)Landroid\/view\/View;/{flag=1} flag{print} flag&&/\.end method/{exit}' "$FILE" > checkRow.smali.txt || true
          zip -qr decoded-mozarebe.zip decoded showProfileDetail.smali.txt checkRow.smali.txt
      - uses: actions/upload-artifact@v4
        with:
          name: decoded-mozarebe
          path: decoded-mozarebe.zip
          retention-days: 1
