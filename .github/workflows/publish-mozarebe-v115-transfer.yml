name: Publish Mozarebe v1.0.15 transfer release
on:
  push:
    paths:
      - '.github/workflows/publish-mozarebe-v115-transfer.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode transfer files
        run: |
          set -euo pipefail
          base64 -d transfer/Mozarebe-v1.0.15-fixedkey.apk.b64 > Mozarebe-v1.0.15-fixedkey.apk
          base64 -d transfer/Mozarebe-Android-v1.0.15-source.zip.b64 > Mozarebe-Android-v1.0.15-source.zip
          sha256sum Mozarebe-v1.0.15-fixedkey.apk > Mozarebe-v1.0.15-fixedkey.apk.sha256
      - name: Publish temporary release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="mozarebe-v1.0.15-chat-transfer"
          gh release delete "$TAG" --yes --cleanup-tag >/dev/null 2>&1 || true
          gh release create "$TAG"             Mozarebe-v1.0.15-fixedkey.apk             Mozarebe-v1.0.15-fixedkey.apk.sha256             Mozarebe-Android-v1.0.15-source.zip             --title "Mozarebe v1.0.15 Quick View"             --notes "Temporary transfer release for APK/source."
